org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The JDK is deliberately NOT pinned here: build.cmd / build.sh pass
# -Dorg.gradle.java.home for whichever toolchain they resolve (./tools/jdk
# first). Gradle 8.11 runs on JDK 17..23 only - Android Studio's embedded JBR
# (Java 25) and newer system JDKs cannot start the daemon.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
